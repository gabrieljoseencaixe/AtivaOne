   <div class="tablewrap" style="max-height:300px;margin-top:10px;border:1px solid var(--line);border-radius:12px"><table><thead><tr><th>Linha</th><th>Registro</th><th>Resultado</th></tr></thead><tbody>${r.rows.slice(0,300).map(x=>`<tr style="cursor:default"><td class="num">${x.line}</td><td>${esc(x.label)}</td><td class="wrap">${x.errs.length?`<span class="tag es-bad">Ignorado</span> <small style="display:inline">${esc(x.errs.join('; '))}</small>`:'<span class="tag es-ok">Pronto</span>'}</td></tr>`).join('')}</tbody></table></div>${r.rows.length>300?`<p class="hint">Mostrando as 300 primeiras de ${r.rows.length} linhas.</p>`:''}`;
  impFoot(ok.length);
}
function impFoot(n){const f=$('#modal-root footer');if(!f)return;
  f.innerHTML=`<button class="btn" data-act="m-close">Cancelar</button><button class="btn" data-act="imp-copy">${ic('copy')}Copiar modelo</button><button class="btn" data-act="imp-check">Conferir de novo</button>${n?`<button class="btn primary" data-act="imp-run">Importar ${n} ${plural(n,IMP[IMPST.kind].singular,IMP[IMPST.kind].plural)}</button>`:''}`}
function impRun(){
  const r=IMPST&&IMPST.res;if(!r)return;const kind=IMPST.kind,def=IMP[kind];if(!guard(def.perm))return;
  const ok=r.rows.filter(x=>!x.errs.length);if(!ok.length)return;const now=Date.now();
  r.newG.forEach(g=>{delete g._new;if(!Grps().some(x=>norm(x.name)===norm(g.name)))DB.groups.push(g)});
  r.newC.forEach(c=>{delete c._new;c.createdAt=now;if(!Cats().some(x=>norm(x.name)===norm(c.name)))DB.cats.push(c)});
  const add=(listName,key)=>{const arr=co()[key]||(co()[key]=[]);r.newList[listName].forEach(v=>{if(!pick(arr,v))arr.push(v)})};
  add('operadoras','operadoras');add('setores','setores');add('fabricantes','fabricantes');
  let allocFail=0;
  ok.forEach(({rec})=>{
    if(kind==='emps'){DB.employees.push({id:uid('e'),co:S.co,...rec})}
    if(kind==='lines'){const cost=rec.cost,emp=rec.empId;
      const nl={id:uid('l'),co:S.co,number:rec.number,operadora:rec.operadora,service:rec.service,iccid:rec.iccid,groupId:rec.groupId,catId:rec.catId,status:rec.status,employeeId:null,setor:rec.setor||'',plano:rec.plano,activatedAt:rec.activatedAt,allocatedAt:null,returnedAt:null,cost,costHistory:cost!=null?[{ts:now,value:cost,userId:S.user.id}]:[],venc:rec.venc,obs:rec.obs,attach:[],deviceId:null,createdAt:now,createdBy:S.user.id,updatedAt:now,updatedBy:S.user.id};
      DB.lines.push(nl);if(emp){try{nl.status=ST.LIVRE;doAllocate(nl,emp,{obs:'Alocação na importação'})}catch(e){allocFail++}}}
    if(kind==='devs'){const nd={id:uid('d'),co:S.co,fabricante:rec.fabricante,modelo:rec.modelo,imei1:rec.imei1,imei2:rec.imei2,patrimonio:rec.patrimonio,estado:rec.estado,acess:rec.acess,obs:rec.obs,employeeId:null,lineId:null,deliveredAt:null,responsibleId:null,createdAt:now,createdBy:S.user.id,updatedAt:now,updatedBy:S.user.id};
      DB.devices.push(nd);if(rec.lineId){const l=lineOf(rec.lineId);if(l)linkDevice(l,nd.id)}}
  });
  audit('Importou',kind==='emps'?'Colaborador':kind==='lines'?'Linha':'Aparelho',null,ok.length+' '+def.plural+' importados');save();closeModal();
  toast('Importação concluída: '+ok.length+' '+plural(ok.length,def.singular,def.plural)+'.'+(allocFail?' '+allocFail+' sem alocação.':''));
  if(kind==='emps')go('colaboradores');refresh();
}
ACT['import']=d=>impOpen(d.k);

ACT['imp-example']=()=>{const t=$('#imp_txt');if(!t)return;t.value=csvOut(IMP[IMPST.kind].example);$('#imp_res').innerHTML='<div class="note warn">Este é só um exemplo do formato, com dados fictícios. Apague este texto e cole os seus dados antes de conferir. Se importar assim, os registros de exemplo ficarão no sistema.</div>'};
ACT['imp-copy']=async()=>{const txt=csvOut([IMP[IMPST.kind].example[0]]);let ok=false;try{await navigator.clipboard.writeText(txt);ok=true}catch(e){const t=$('#imp_txt');if(t){const old=t.value;t.value=txt;t.select();try{ok=document.execCommand('copy')}catch(_){}t.value=old}}toast(ok?'Títulos das colunas copiados. Cole na primeira linha da sua planilha.':'Não foi possível copiar. Use "Ver exemplo" e copie o texto.',!ok)};
/* ---------- Supabase (modo hospedado): login e dados por funções do banco (arquivo ativaone_simples.sql) ---------- */
let SB=null;
const SBCFG_KEY='ativaone.sbcfg';
function sbNormUrl(v){v=String(v||'').trim();if(!v)return '';if(/^[a-z0-9]{15,30}$/i.test(v))return 'https://'+v.toLowerCase()+'.supabase.co';
  if(!/^https?:\/\//i.test(v))v='https://'+v;try{return new URL(v).origin}catch(e){return ''}}
function sbReadCfg(){let c=window.AO_CONFIG;if(c&&c.url&&c.key&&!/COLE/i.test(c.url+c.key))return {url:c.url,key:c.key};
  try{const l=JSON.parse(localStorage.getItem(SBCFG_KEY)||'null');if(l&&l.url&&l.key)return l}catch(e){}return null}
function sbInit(){const c=sbReadCfg();if(!c)return false;const url=sbNormUrl(c.url);if(!url)return false;SB={url,key:String(c.key).trim(),session:null,refreshing:null};return true}
function sbSetupForm(v){
  formModal({title:'Conectar ao Supabase',sub:'Informe os dados do seu projeto. Ficam salvos só neste navegador.',submitLabel:'Conectar',values:v||{},
   sections:[{fields:[
    {id:'url',label:'URL ou ID do projeto',req:true,span:true,ph:'https://xxxx.supabase.co',hint:'O ID é o trecho que aparece no endereço do painel: supabase.com/dashboard/project/ID'},
    {id:'key',label:'Chave anon / publishable',req:true,span:true,ph:'eyJ... ou sb_publishable_...',hint:'Em Project Settings > API Keys. Nunca use a chave service_role.'}]}],
   validate:val=>{const e={};if(!sbNormUrl(val.url))e.url='Informe a URL ou o ID do projeto.';if(/service_role/i.test(val.key)||/^sb_secret_/i.test(val.key.trim()))e.key='Essa é uma chave secreta. Use a anon ou a publishable.';else if(val.key.trim().length<20)e.key='Chave muito curta.';return e},
   onSubmit:async val=>{const url=sbNormUrl(val.url),key=val.key.trim();
     try{const r=await fetch(url+'/auth/v1/settings',{headers:{apikey:key}});if(!r.ok)throw new Error(r.status)}
     catch(e){const el=$('#e_url');if(el){el.textContent='Não consegui conectar. Confira a URL e a chave.';el.closest('.fld').classList.add('bad')}return}
     try{localStorage.setItem(SBCFG_KEY,JSON.stringify({url,key}))}catch(e){toast('Este navegador bloqueou o armazenamento. Preencha o config.js.',true);return}
     location.reload()}});
}

async function rpc(fn,args){
  const h={apikey:SB.key,'Content-Type':'application/json'};if(/^eyJ/.test(SB.key))h.Authorization='Bearer '+SB.key;
  const r=await fetch(SB.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(args||{})});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){const miss=r.status===404||(j&&j.code==='PGRST202');
    const e=new Error(miss?'As funções do AtivaOne não existem neste Supabase. Rode o arquivo ativaone_simples.sql no SQL Editor.':((j&&(j.message||j.hint))||('HTTP '+r.status)));e.status=r.status;e.code=miss?'sql_faltando':'http';throw e}
  return j;
}
const sbTok=()=>SB&&SB.session?SB.session.token:null;
async function rpcS(fn,args){const j=await rpc(fn,{p_token:sbTok(),...args});if(j&&j.erro){const e=new Error(j.erro);e.code=j.erro;if(j.erro==='sessao'&&S.user)setTimeout(()=>logout('Sua sessão expirou. Entre de novo para continuar.'),50);throw e}return j}
/* mesma interface do banco do artefato: doc(caminho).get/set/delete e collection(nome).where().orderBy().limit().get() */
const SBH={
  doc(path){const [coll,...rest]=path.split('/'),id=rest.join('/');
    return {
      async get(){if(coll==='companies'){const d=await rpcS('ao_empresa',{});return {id,exists:true,data:()=>d}}return {id,exists:false,data:()=>undefined}},
      async set(d){await rpcS('ao_gravar',{p_colecao:coll,p_id:id,p_dados:d})},
      async delete(){if(coll==='companies'||coll==='users')return;await rpcS('ao_apagar',{p_colecao:coll,p_id:id})}
    }},
  collection(coll){const st={ord:null,lim:1000};
    const q={where(){return q},orderBy(f,dir){st.ord=dir;return q},limit(n){st.lim=n;return q},
      async get(){const rows=await rpcS('ao_listar',{p_colecao:coll,p_limite:st.lim,p_desc:st.ord==='desc'});const docs=rows.map(d=>({id:d.id,exists:true,data:()=>d}));return {docs,size:docs.length}}};
    return q}
};
const SB_MSG={
  credenciais:GENERIC_ERR,
  pendente:'Sua conta foi criada e está aguardando ativação. Você poderá entrar assim que ela for ativada.',
  inativo:'Este usuário está inativo. Fale com o administrador da empresa.',
  suspensa:'O acesso desta empresa está suspenso. Fale com o suporte do AtivaOne.'
};
async function tryLoginSb(email,pw){
  const em=mailKey(email);
  if(!/^\S+@\S+\.\S+$/.test(em))return {err:'Informe um e-mail válido.'};
  let j;try{j=await rpc('ao_entrar',{p_email:em,p_senha:pw});
    if(j&&j.erro==='credenciais'&&pw!==pw.trim())j=await rpc('ao_entrar',{p_email:em,p_senha:pw.trim()})}   // espaço sobrando de copiar e colar
  catch(e){return {err:e.code==='sql_faltando'?e.message:'Não foi possível entrar agora. Detalhe técnico: '+e.message}}
  if(j.erro==='bloqueado')return {err:`Muitas tentativas. Aguarde ${j.segundos||60} s e tente de novo.`,locked:true};
  if(j.erro)return {err:SB_MSG[j.erro]||GENERIC_ERR,pending:j.erro==='pendente'};
  SB.session={token:j.token};
  let data;try{data=await loadCompany(j.empresa)}catch(e){SB.session=null;return {err:'Não foi possível carregar os dados da empresa. Tente de novo.'}}
  return {slug:j.empresa,data,userId:j.email};
}
async function doSignupSb(v){
  let j;try{j=await rpc('ao_cadastrar',{p_empresa:v.empresa.trim(),p_nome:v.nome.trim(),p_email:mailKey(v.email),p_senha:v.p1})}
  catch(e){throw {code:'sb_error',message:e.message}}
  if(j.erro==='email_existe')return {err:'email',msg:'Este e-mail já tem cadastro. Entre com ele ou use "Esqueci minha senha".'};
  if(j.erro==='senha_fraca')return {err:'p1',msg:'Use pelo menos 8 caracteres, com letras e números.'};
  if(j.erro)return {err:'empresa',msg:'Confira os dados informados.'};
  return {ok:true,newCompany:j.nova_empresa};
}
async function sbPedirSenha(email){try{await rpc('ao_pedir_senha',{p_email:mailKey(email)})}catch(e){}}
async function sbSignOut(){if(!sbTok())return;try{await rpc('ao_sair',{p_token:sbTok()})}catch(e){}SB.session=null}
/* =====================  EVENTOS E INÍCIO  ===================== */
const ASUBMIT={'par-add':parAdd,'par-timeout':parTimeout};
document.addEventListener('click',e=>{
  S.last=Date.now();
  const t=e.target.closest('[data-act]');

Object.assign(ACT,{
 'm-close':()=>{AFTER=null;closeModal()},

 signup:()=>signupForm(),
 sbsetup:()=>sbSetupForm(),
 forgot:()=>formModal({title:'Recuperar senha',sub:'Informe o e-mail da sua conta.',submitLabel:'Pedir nova senha',
   sections:[{fields:[{id:'email',label:'E-mail',type:'email',req:true,span:true}]}],
   onSubmit:async v=>{if(SB){await sbPedirSenha(v.email);closeModal();infoModal({title:'Pedido registrado',body:'<p style="margin:0">Se existir um cadastro com este e-mail, o administrador da empresa é avisado para gerar uma senha temporária em <b>Usuários e acessos</b>. Nenhum e-mail é enviado automaticamente.</p>'});return}
     try{if(DBH){const us=await DBH.doc('users/'+mailKey(v.email)).get();if(us.exists)recordSec(us.data().co,'Recuperação de senha','Pedido para "'+mailKey(v.email)+'"')}}catch(e){}
     closeModal();infoModal({title:'Pedido registrado',body:'<p style="margin:0">Se existir um cadastro ativo com este e-mail, o administrador da empresa é avisado para gerar uma senha temporária em <b>Usuários e acessos</b>. Nenhum e-mail é enviado automaticamente.</p>'})}}),
 goto:d=>{const f=d.k?{[d.k]:d.v}:null;go(d.r,f,d.ns)},

document.addEventListener('keydown',e=>{
  S.last=Date.now();
  if(e.key==='Escape'){if($('#modal-root .modal')){AFTER=null;closeModal()}else if(DR)closeDrawer();else{const r=$('#gres');if(r)r.hidden=true}return}
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&$('#gs')){e.preventDefault();$('#gs').focus();return}
  if(e.key==='Enter'){
    const el=document.activeElement;
    if(el&&el.tagName==='TR'&&el.dataset.act){ACT[el.dataset.act]?.(el.dataset);return}
    if($('#modal-root .modal')&&el&&el.tagName==='INPUT'&&el.type!=='file'&&CUR&&CUR.submit){e.preventDefault();CUR.submit()}
  }
});
window.addEventListener('hashchange',()=>{if(S.user){closeDrawer();renderView();window.scrollTo(0,0)}});
setInterval(()=>{if(S.user&&Date.now()-S.last>co().timeout*60000)logout('Sua sessão foi encerrada por inatividade. Entre de novo para continuar.')},5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pullFresh()});
setInterval(()=>{if(!document.hidden)pullFresh()},15000);setInterval(liveTag,1000);
(async function init(){
  try{const t=localStorage.getItem(THEME_KEY);if(t)document.documentElement.dataset.theme=t}catch(e){}
  try{['linhaleads.proto.v3','linhaleads.theme','linhaleads.lastco','ativaone.demo.v1'].forEach(k=>localStorage.removeItem(k))}catch(e){}

  if(sbInit()){DBH=SBH;MODE='none'}
  else try{DBH=await Promise.race([window.claude&&window.claude.use?window.claude.use('db'):null,new Promise(r=>setTimeout(()=>r(null),6000))])}catch(e){DBH=null}
  const st=$('#dbstatus');if(st){st.className='dbstatus '+(DBH?'ok':'off');st.textContent=DBH?'Banco de dados conectado':'Banco de dados não conectado';
    }

})();
