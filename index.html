<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>AtivaOne</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: sidebar preta fixa, topo com busca global, conteúdo em painéis brancos sobre fundo neutro quente. Marca: chip SIM com canto cortado. */
:root{
  --red:#C8102E; --red-ink:#A50D26; --red-soft:#FBEBED; --on-red:#fff;
  --ink:#141112; --ink-2:#3a3436; --muted:#6c6467;
  --canvas:#F6F4F1; --paper:#ffffff; --line:#E6E2DD; --line-2:#EFECE8;
  --green:#2B7A52; --green-soft:#E4F2EA;
  --amber:#9A6200; --amber-soft:#FBF0D9;
  --grey-soft:#ECE9E9;
  --side:#0D0B0C; --side-2:#1b1819; --side-line:#2a2527; --side-ink:#EDE8E8; --side-muted:#9a9194;
  --shadow:0 1px 2px rgba(20,17,18,.04),0 14px 34px -22px rgba(20,17,18,.22);
  --f-display:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:9px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --red:#F2434F; --red-ink:#ff6a74; --red-soft:#3a1519; --on-red:#1a0305;
  --ink:#F3EEEE; --ink-2:#d2cbcc; --muted:#a0969a;
  --canvas:#0E0C0D; --paper:#1A1718; --line:#322d2f; --line-2:#262224;
  --green:#5CC08C; --green-soft:#16291f; --amber:#E6B04C; --amber-soft:#2e2410; --grey-soft:#2a2527;
  --side:#050405; --side-2:#141112; --side-line:#262123;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --red:#F2434F; --red-ink:#ff6a74; --red-soft:#3a1519; --on-red:#1a0305;
  --ink:#F3EEEE; --ink-2:#d2cbcc; --muted:#a0969a;
  --canvas:#0E0C0D; --paper:#1A1718; --line:#322d2f; --line-2:#262224;
  --green:#5CC08C; --green-soft:#16291f; --amber:#E6B04C; --amber-soft:#2e2410; --grey-soft:#2a2527;
  --side:#050405; --side-2:#141112; --side-line:#262123;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font:400 14px/1.55 var(--f-body);;-webkit-font-smoothing:antialiased;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--red-ink)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:4px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-stretch:92%}
.muted{color:var(--muted)} .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- login ---------- */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.login-art{background:var(--red);color:#fff;position:relative;overflow:hidden;padding:48px clamp(28px,5vw,72px);display:flex;flex-direction:column;justify-content:space-between;gap:32px;min-height:100vh}
.login-art .brand{display:flex;align-items:center;gap:12px}
.login-art h1{font-size:clamp(34px,4.6vw,62px);line-height:.98;font-stretch:112%;font-weight:800;max-width:11ch;color:#fff}
.login-art p{max-width:38ch;margin:18px 0 0;font-size:16px;color:#fff;opacity:.92}
.sim{position:absolute;right:-70px;top:9%;width:min(360px,48%);transform:rotate(9deg)}
.login-art .facts{display:flex;gap:28px;flex-wrap:wrap;position:relative;z-index:1}
.login-art .facts b{display:block;font:800 30px/1 var(--f-display);font-stretch:90%}
.login-art .facts span{font-size:13px;opacity:.92}
.login-form{display:flex;align-items:center;justify-content:center;padding:40px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px));background:var(--paper)}
.login-card{width:min(400px,100%);display:flex;flex-direction:column;gap:18px}
.login-card h2{font-size:26px;font-weight:800}
.login-card .sub{color:var(--muted);margin:-10px 0 4px}
.login-links{display:flex;gap:8px;flex-wrap:wrap}.login-links .btn{flex:1 1 auto}
.dbstatus{margin:0;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}.dbstatus:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}.dbstatus.ok:before{background:var(--green)}.dbstatus.off:before{background:var(--red)}
.sync{font-size:12.5px;color:var(--muted);margin-left:auto}.sync.error{color:var(--red-ink);font-weight:600}.sync.saved:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px}
.cotag{margin-left:0!important}
.demo{border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;font-size:13px;display:grid;gap:8px;background:var(--canvas)}
.demo b{font-weight:600}
.demo .chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-btn{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.chip-btn:hover{border-color:var(--ink)}
.lockmsg{background:var(--red-soft);color:var(--red-ink);padding:10px 12px;border-radius:var(--r);font-size:13.5px}

/* ---------- campos ---------- */
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-weight:600;font-size:13px}
.fld .req{color:var(--red);font-style:normal;margin-left:3px}
input[type=text],input[type=password],input[type=search],input[type=tel],input[type=number],input[type=date],input[type=email],select,textarea{width:100%;min-height:40px;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:8px 11px;transition:border-color .12s}
input[type=color]{width:56px;height:40px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);padding:3px}
textarea{min-height:76px;resize:vertical}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--red);outline-offset:-1px;border-color:var(--red)}
input[disabled],select[disabled]{background:var(--canvas);color:var(--muted)}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--red)}
.err{color:var(--red-ink);font-size:12.5px;min-height:0}
.hint{color:var(--muted);font-size:12.5px}
.check{display:flex;align-items:center;gap:8px;font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--red)}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--paper);font-weight:600;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.primary:hover{background:var(--red-ink);border-color:var(--red-ink)}
.btn.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--line-2)}
.btn.danger{color:var(--red-ink);border-color:var(--red)}
.btn.sm{min-height:32px;padding:0 11px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:var(--r);cursor:pointer}
.icon-btn:hover{background:var(--line-2)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:20px 14px;gap:22px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand .wm{font:800 19px/1 var(--f-display);font-stretch:118%;letter-spacing:.01em;color:#fff}
.brand .wm i{font-style:normal;color:var(--red)}
.login-art .brand .wm{font-size:22px} .login-art .brand .wm i{color:#fff;opacity:.78}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav .grp{font-size:12px;color:var(--side-muted);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r);color:var(--side-ink);text-decoration:none;font-weight:500;position:relative}
.nav a:hover{background:var(--side-2)}
.nav a[aria-current=page]{background:var(--red);color:#fff}
.nav a .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:11.5px;padding:1px 7px;font-weight:700}
.nav a[aria-current=page] .badge{background:#fff;color:var(--red-ink)}
.side .who{margin-top:auto;border-top:1px solid var(--side-line);padding:14px 6px 0;display:flex;gap:10px;align-items:center}
.side .who .av{width:34px;height:34px;border-radius:50%;background:var(--side-2);display:grid;place-items:center;font:700 13px var(--f-display);border:1px solid var(--side-line)}
.side .who small{display:block;color:var(--side-muted);font-size:12px;line-height:1.2}
.side .who strong{font-size:13.5px;font-weight:600;line-height:1.2}
.side .who .icon-btn{margin-left:auto;color:var(--side-ink)} .side .who .icon-btn:hover{background:var(--side-2)}
.main-col{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px clamp(16px,2.4vw,32px)}
.top .menu{display:none}
.gsearch{position:relative;flex:1;max-width:560px}
.gsearch input{padding-left:40px;background:var(--canvas);border-color:transparent;min-height:42px}
.gsearch input:focus{background:var(--paper)}
.gsearch>svg{position:absolute;left:12px;top:12px;color:var(--muted)}
.gsearch kbd{position:absolute;right:10px;top:10px;font:600 12px var(--f-body);border:1px solid var(--line);border-radius:4px;padding:1px 7px;color:var(--muted);background:var(--paper)}
.results{position:absolute;left:0;right:0;top:48px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 18px 40px -12px rgba(0,0,0,.35);max-height:70vh;overflow:auto;z-index:40}
.results h4{font-size:12.5px;color:var(--muted);padding:10px 14px 4px;font-weight:600}
.results button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;justify-content:space-between;border:0;background:none;padding:9px 14px;cursor:pointer}
.results button:hover,.results button:focus-visible{background:var(--canvas)}
.results .empty{padding:18px 14px;color:var(--muted)}
.cotag{margin-left:auto;display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;border:1px solid var(--line);border-radius:99px;padding:5px 12px;white-space:nowrap}
.cotag:before{content:"";width:8px;height:8px;background:var(--green);border-radius:50%}
.content{padding:clamp(18px,2.4vw,32px);padding-left:max(clamp(16px,2.4vw,32px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,2.4vw,32px),env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px;max-width:1480px;width:100%}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-h h1{font-size:clamp(26px,3vw,36px);font-weight:800;font-stretch:104%}
.page-h p{margin:4px 0 0;color:var(--muted)}
.page-h .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- painéis ---------- */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.panel>header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 0}
.panel>header h3{font-size:16px;font-weight:700}
.panel .body{padding:16px 18px 18px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px 16px 14px;border:1px solid var(--line);background:var(--paper);border-radius:10px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.kpi:hover{border-color:var(--ink);transform:translateY(-2px)}
.kpi .l{font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:7px}
.kpi .v{font:800 40px/1 var(--f-display);font-stretch:88%;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.total{background:var(--side);border-color:var(--side);color:#fff} .kpi.total .l,.kpi.total .s{color:#bdb4b7}
.kpi.red .v{color:var(--red)}
.kpi.green .l:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--green)}
.kpi.red .l:before{content:"";width:9px;height:9px;background:var(--red);transform:rotate(45deg)}
.dash-cols{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:16px;align-items:start}
.stackcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filters .fld{min-width:150px;flex:1 1 150px}
.filters .fld.grow{flex:2 1 260px}
.filters select,.filters input{min-height:38px}
.linemap{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px}
.cell{aspect-ratio:1;border-radius:4px;border:1.5px solid var(--ink);background:var(--paper);cursor:pointer;padding:0;position:relative}
.cell.aloc{background:var(--green);border-color:var(--green)}
.cell.bloq{background:var(--red);border-color:var(--red)}
.cell.canc{background:var(--grey-soft);border:1.5px dashed var(--muted)}
.cell.canc:after{content:"";position:absolute;left:3px;right:3px;top:50%;height:1.5px;background:var(--muted);transform:rotate(-35deg)}
.cell.reg{background:repeating-linear-gradient(45deg,var(--amber-soft),var(--amber-soft) 3px,var(--paper) 3px,var(--paper) 6px);border-color:var(--amber)}
.cell:hover{transform:scale(1.18);z-index:2}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:14px}
.legend button{display:flex;align-items:center;gap:7px;background:none;border:0;padding:2px 0;cursor:pointer;color:var(--ink-2)}
.legend .cell{width:14px;height:14px;aspect-ratio:auto;cursor:inherit}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(118px,1.3fr) minmax(0,1.2fr) 34px;gap:10px;align-items:center;border:0;background:none;padding:4px 0;text-align:left;cursor:pointer;border-radius:4px}
.bar-row:hover{background:var(--canvas)}
.bar-row .t{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.bar-row .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .tr{height:12px;background:var(--line-2);border-radius:3px;overflow:hidden}
.bar-row .tr i{display:block;height:100%;border-radius:3px}
.bar-row .n{text-align:right;font-weight:700}
.dot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.stack{display:flex;height:16px;border-radius:4px;overflow:hidden;gap:2px;margin-bottom:14px}
.stack i{display:block;height:100%}
.plist{display:flex;flex-direction:column}
.pitem{display:flex;gap:12px;align-items:flex-start;text-align:left;border:0;border-top:1px solid var(--line-2);background:none;padding:11px 0;cursor:pointer;width:100%}
.pitem:first-child{border-top:0}
.pitem:hover{background:var(--canvas)}
.pitem .ic{color:var(--red);margin-top:2px}
.pitem small{display:block;color:var(--muted)}
.okbox{display:flex;gap:12px;align-items:center;color:var(--green);font-weight:600;padding:14px;background:var(--green-soft);border-radius:var(--r)}

/* ---------- tabelas ---------- */
.tablewrap{overflow:auto;max-height:calc(100vh - 330px);min-height:140px;border-top:1px solid var(--line)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
th{position:sticky;top:0;z-index:2;background:var(--paper);text-align:left;font-weight:700;font-size:12.5px;color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--ink);white-space:nowrap}
td{white-space:nowrap;padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--canvas)}
tbody tr.dim td{opacity:.62}
td .main{font-weight:600} td.wrap,td.wrap .main{white-space:normal} td small{display:block;color:var(--muted);font-size:12.5px}
td.r,th.r{text-align:right}
.rowacts{display:flex;gap:6px;justify-content:flex-end}
.tfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;flex-wrap:wrap}
.emptystate{padding:46px 20px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.emptystate b{color:var(--ink);font-family:var(--f-display);font-size:18px}

/* ---------- etiquetas ---------- */
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:2px 9px 2px 7px;border-radius:99px;border:1px solid var(--line);background:var(--paper);white-space:nowrap;line-height:1.5}
.tag .dot{width:8px;height:8px}
.st-Disponível{border-color:var(--ink);color:var(--ink)}
.st-Disponível:before{content:"";width:8px;height:8px;border:1.8px solid currentColor;border-radius:50%}
.st-Alocada{background:var(--green-soft);border-color:transparent;color:var(--green)}
.st-Alocada:before{content:"";width:8px;height:8px;background:currentColor;border-radius:50%}
.st-Bloqueada{background:var(--red-soft);border-color:transparent;color:var(--red-ink)}
.st-Bloqueada:before{content:"";width:8px;height:8px;background:currentColor;transform:rotate(45deg)}
.st-Cancelada{background:var(--grey-soft);border-color:transparent;color:var(--muted);text-decoration:line-through}
.st-Cancelada:before{content:"×";text-decoration:none;font-weight:800;display:inline-block}
.st-regul{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.st-regul:before{content:"";width:0;height:0;border:4.5px solid transparent;border-bottom:8px solid currentColor;border-top:0}
.al-no{border-style:dashed;border-color:var(--muted);color:var(--muted)}
.al-yes{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.es-ok{background:var(--green-soft);color:var(--green);border-color:transparent}
.es-warn{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.es-bad{background:var(--red-soft);color:var(--red-ink);border-color:transparent}
.es-off{background:var(--grey-soft);color:var(--muted);border-color:transparent}

/* ---------- modal, gaveta, toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,8,9,.58);display:flex;align-items:flex-start;justify-content:center;padding:0 16px;overflow:auto;z-index:100}
.modal{margin:5vh 0;background:var(--paper);border-radius:12px;width:min(620px,100%);box-shadow:0 30px 80px -20px rgba(0,0,0,.6);display:flex;flex-direction:column;border:1px solid var(--line)}
.modal.wide{width:min(860px,100%)}
.modal>header{padding:20px 24px 4px}
.modal>header h2{font-size:22px;font-weight:800}
.modal>header p{margin:4px 0 0;color:var(--muted)}
.modal .mbody{padding:14px 24px 6px;display:flex;flex-direction:column;gap:18px}
.modal>footer{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px 20px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--paper);border-radius:0 0 12px 12px;border-top:1px solid var(--line-2);margin-top:8px}
.fsec h4{font-size:15px;font-weight:700;padding-bottom:8px;border-bottom:1px solid var(--ink);margin-bottom:12px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.fsec h4 small{font:400 12.5px var(--f-body);color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fgrid .span2{grid-column:1/-1}
.note{background:var(--canvas);border-radius:var(--r);padding:10px 12px;font-size:13.5px;color:var(--ink-2)}
.note.warn{background:var(--amber-soft);color:var(--amber)}
.note.bad{background:var(--red-soft);color:var(--red-ink)}
.dl{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dl dt,.dl dd{margin:0;padding:9px 12px;border-bottom:1px solid var(--line-2);min-width:0;overflow-wrap:anywhere}
.dl dt{color:var(--muted);font-size:13px;background:var(--canvas)}
.dl dd{font-weight:500}
.dl dt:last-of-type,.dl dd:last-of-type{border-bottom:0}
.drawer-scrim{position:fixed;inset:0;background:rgba(10,8,9,.45);z-index:80;display:flex;justify-content:flex-end}
.drawer{width:min(640px,100%);background:var(--paper);height:100%;overflow:auto;display:flex;flex-direction:column;box-shadow:-24px 0 60px -20px rgba(0,0,0,.5);animation:slide .2s ease-out;padding-top:env(safe-area-inset-top,0px)}
@keyframes slide{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.drawer>header{padding:20px 24px 14px;display:flex;gap:12px;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line)}
.drawer>header h2{font-size:30px;font-weight:800;font-stretch:96%;line-height:1.05}
.drawer .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.drawer .dbody{padding:18px 24px 40px;display:flex;flex-direction:column;gap:20px}
.drawer .actions{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--red)}
.timeline{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.timeline li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:12px;padding-bottom:16px;position:relative}
.timeline li:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);margin-top:5px}
.timeline li:after{content:"";position:absolute;left:4px;top:18px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child:after{display:none}
.timeline li.ok:before{border-color:var(--green);background:var(--green)}
.timeline li.bad:before{border-color:var(--red);background:var(--red)}
.timeline b{display:block}
.timeline small{color:var(--muted);display:block}
#toast-root{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:200;align-items:flex-end}
.toast{background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:var(--r);display:flex;gap:10px;align-items:center;box-shadow:0 14px 34px -10px rgba(0,0,0,.5);max-width:min(420px,calc(100vw - 32px));animation:slide .18s ease-out;border-left:4px solid var(--green)}
.toast.bad{border-left-color:var(--red)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.gcard{padding:18px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.gcard:before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--gc)}
.gcard h3{font-size:19px;margin-top:4px}
.gcard .cnt{font:800 34px/1 var(--f-display);font-stretch:88%}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:26px;height:26px;border-radius:5px;border:2px solid var(--paper);outline:1px solid var(--line);cursor:pointer}
.tagedit{display:flex;gap:6px;flex-wrap:wrap}
.tagedit .tag button{border:0;background:none;cursor:pointer;padding:0 0 0 2px;color:var(--muted);font-size:15px;line-height:1}
.rep-layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;align-items:start}
.replist{display:flex;flex-direction:column;gap:6px;padding:10px}
.replist button{text-align:left;border:1px solid transparent;background:none;padding:10px 12px;border-radius:var(--r);cursor:pointer}
.replist button small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.replist button[aria-current=true]{border-color:var(--ink);background:var(--canvas)}
.replist button:hover{background:var(--canvas)}
.rep-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 18px}
.mtx{overflow:auto}
.mtx td,.mtx th{text-align:center} .mtx td:first-child,.mtx th:first-child{text-align:left}
.mtx tbody tr{cursor:default}
.mtx input{width:20px;height:20px;accent-color:var(--red)}
.csvbox{width:100%;min-height:220px;font:12.5px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.ovl{display:none}
.mobile-only{display:none}

@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:980px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:280px;transform:translateX(-102%);transition:transform .2s;box-shadow:none}
  .side.open{transform:none;box-shadow:20px 0 60px -10px rgba(0,0,0,.6)}
  .dash-cols{grid-template-columns:minmax(0,1fr)}
  .replist{flex-direction:row;overflow-x:auto}.replist button{flex:none;max-width:230px}.replist button small{display:none}
  .top .menu{display:inline-grid}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .rep-layout{grid-template-columns:minmax(0,1fr)}
  .login{grid-template-columns:minmax(0,1fr)}
  .login-art{min-height:auto;padding-top:28px;padding-bottom:28px}
  .login-art h1{max-width:none}.sim{width:240px;right:-60px;bottom:-60px}
  .login-art .facts{display:none}
  .sim{display:none}
  .cotag{display:none}
}
@media (max-width:640px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3,.duo{grid-template-columns:minmax(0,1fr)}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .tablewrap{max-height:none}
  .gsearch kbd{display:none}
  .kpi .v{font-size:34px}
  .scrim{padding:0}.modal{margin:0;border-radius:0;min-height:100%;width:100%}
  .dl{grid-template-columns:minmax(0,1fr)}.dl dt{border-bottom:0;padding-bottom:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ================= Refinamento visual: tipografia editorial, superfícies leves, menos peso ================= */
body{letter-spacing:-.003em;font-synthesis:none}
h1,h2{font-family:var(--f-display);font-weight:400;letter-spacing:-.018em}
h3,h4{font-family:var(--f-body);font-weight:600;letter-spacing:-.01em}
.num,table,.kpi .v,.bar-row .n{font-variant-numeric:tabular-nums}
.num{font-family:var(--f-body);font-stretch:normal}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
/* campos e botões */
.fld label{font-weight:500;font-size:12.5px;color:var(--ink-2)}
input[type=text],input[type=password],input[type=search],input[type=tel],input[type=number],input[type=date],input[type=email],select,textarea{min-height:42px;border-radius:10px;border-color:var(--line);padding:9px 12px;box-shadow:0 1px 0 rgba(20,17,18,.02)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 4px var(--red-soft)}
.btn{min-height:40px;border-radius:10px;font-weight:550;font-size:13.5px;padding:0 17px;letter-spacing:-.005em;box-shadow:0 1px 0 rgba(20,17,18,.03)}
.btn:hover{border-color:var(--muted);background:var(--canvas)}
.btn.primary{background:linear-gradient(180deg,#d4153a,var(--red));border-color:var(--red-ink);box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 6px 16px -8px rgba(200,16,46,.7)}
.btn.primary:hover{background:linear-gradient(180deg,var(--red),var(--red-ink))}
.btn.dark:hover{background:var(--ink-2)}
.btn.ghost{box-shadow:none}.btn.danger{border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.btn.sm{min-height:32px;border-radius:8px;font-size:12.5px;padding:0 12px}
.icon-btn{border-radius:10px}
/* barra lateral */
.shell{grid-template-columns:262px minmax(0,1fr)}
.side{background:linear-gradient(180deg,#121011,#0B090A);padding:24px 14px 18px;gap:26px;border-right:1px solid #1d191a}
.brand .wm{font:400 27px/1 var(--f-display);font-stretch:normal;letter-spacing:-.01em}
.brand .wm i{color:#E8485F;font-style:italic}
.nav{gap:1px}
.nav .grp{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:18px 12px 8px;color:var(--side-muted);font-weight:600}
.nav a{padding:9px 12px;font-size:13.5px;font-weight:500;color:#c9c1c3;border-radius:10px;gap:11px}
.nav a .ic{width:17px;height:17px;stroke-width:1.6;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.05);color:#fff}
.nav a[aria-current=page]{background:rgba(255,255,255,.09);color:#fff;font-weight:600;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.nav a[aria-current=page]:before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:#E8485F}
.nav a[aria-current=page] .ic{opacity:1;color:#ff7a8c}
.nav a .badge{background:rgba(232,72,95,.18);color:#ff8a99;font-weight:600;padding:1px 8px}
.nav a[aria-current=page] .badge{background:#E8485F;color:#fff}
.side .who{border-top:1px solid #231f20;padding:16px 6px 0}
.side .who .av{font:600 12px var(--f-body);background:linear-gradient(135deg,#2a2425,#1a1617);letter-spacing:.02em}
.side .who strong{font-weight:600}
/* topo e conteúdo */
.top{background:color-mix(in srgb,var(--paper) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);padding:12px clamp(16px,2.6vw,40px)}
.gsearch input{padding-left:42px;border-radius:12px;background:var(--canvas);border:1px solid transparent;min-height:42px;box-shadow:none}
.gsearch input:focus{background:var(--paper);border-color:var(--red)}
.gsearch kbd{border-radius:6px;font-weight:500;top:11px}.gsearch>svg{top:13px;left:14px}
.cotag{border-radius:99px;font-weight:500;background:var(--paper);font-size:12.5px}
.content{padding:clamp(22px,3vw,44px) clamp(16px,2.6vw,40px) 64px;gap:28px;max-width:1520px}
.page-h{align-items:flex-end;padding-bottom:20px;border-bottom:1px solid var(--line)}
.page-h h1{font-size:clamp(32px,3.6vw,46px);font-weight:400;font-stretch:normal;line-height:1.02}
.page-h p{margin-top:8px;font-size:14px;max-width:62ch}
/* painéis */
.panel{border-radius:16px;border-color:var(--line);box-shadow:var(--shadow)}
.panel>header{padding:20px 22px 0}
.panel>header h3{font-size:15px;font-weight:600}
.panel .body{padding:18px 22px 22px}
.kpis{gap:14px}
.kpi{border-radius:16px;padding:20px 20px 18px;gap:8px;border-color:var(--line);box-shadow:var(--shadow)}
.kpi:hover{transform:none;border-color:var(--muted);box-shadow:0 1px 2px rgba(20,17,18,.05),0 18px 36px -22px rgba(20,17,18,.3)}
.kpi .l{font-size:12.5px;font-weight:500}
.kpi .v{font:400 52px/.95 var(--f-display);font-stretch:normal;letter-spacing:-.02em}
.kpi .s{font-size:12px}
.kpi.total{background:radial-gradient(120% 140% at 100% 0,#3a1017 0,#141112 58%);border-color:#141112}
.kpi.total .l,.kpi.total .s{color:#cfc5c8}.kpi.total .v{color:#fff}
.kpi.red .v{color:var(--red)}
.bar-row .tr{height:8px;border-radius:99px}.bar-row .tr i{border-radius:99px}
.bar-row .n{font-weight:600}
.stack{height:10px;border-radius:99px;gap:3px}.stack i{border-radius:99px}
.cell{border-radius:6px;border:1px solid var(--ink-2)}
.cell.canc,.cell.reg{border-width:1px}
.pitem{border-top-color:var(--line-2);padding:13px 6px}.pitem:hover{background:var(--canvas);border-radius:10px}
.okbox{border-radius:12px}
/* tabelas */
.tablewrap{border-top:1px solid var(--line-2)}
table{font-size:13.5px}
th{background:var(--paper);font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--muted);padding:13px 16px;border-bottom:1px solid var(--line)}
td{padding:14px 16px;border-bottom:1px solid var(--line-2)}
tbody tr:hover td{background:color-mix(in srgb,var(--canvas) 70%,var(--paper))}
td .main{font-weight:600;letter-spacing:-.01em}
.tfoot{padding:14px 22px;border-top:1px solid var(--line-2);font-size:12.5px}
.emptystate b{font:400 24px var(--f-display)}
/* etiquetas */
.tag{font-size:12px;font-weight:550;padding:3px 10px 3px 8px;letter-spacing:0}
.st-Disponível{border-color:var(--line);color:var(--ink)}
/* modais e gaveta */
.scrim{background:rgba(14,11,12,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.modal{border-radius:18px;border-color:transparent;box-shadow:0 40px 100px -30px rgba(0,0,0,.55),0 0 0 1px rgba(20,17,18,.06)}
.modal>header{padding:28px 30px 6px}
.modal>header h2{font-size:32px;font-weight:400;line-height:1.05}
.modal>header p{font-size:13.5px}
.modal .mbody{padding:16px 30px 8px;gap:22px}
.modal>footer{padding:18px 30px 24px;border-radius:0 0 18px 18px}
.fsec h4{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:9px}
.fsec h4 small{text-transform:none;letter-spacing:0}
.note{border-radius:10px}
.dl{border-radius:12px;border-color:var(--line)}
.dl dt{font-size:12.5px}
.drawer{width:min(680px,100%);box-shadow:-30px 0 80px -30px rgba(0,0,0,.55)}
.drawer>header{padding:28px 30px 20px;border-bottom:1px solid var(--line-2)}
.drawer>header h2{font-size:40px;font-weight:400;font-stretch:normal;line-height:1}
.drawer .dbody{padding:22px 30px 48px;gap:24px}
.tabs button{font-size:13.5px;font-weight:550;padding:11px 14px}
.tabs button[aria-selected=true]{border-bottom-width:2px}
.timeline li:before{border-width:1.5px}
.toast{border-radius:12px;font-size:13.5px}
.gcard{border-radius:16px}.gcard:before{height:4px}.gcard h3{font:400 26px/1.1 var(--f-display);letter-spacing:-.01em}
.gcard .cnt{font:400 46px/1 var(--f-display);font-stretch:normal}
.replist button{border-radius:10px}

.filters select,.filters input{min-height:42px}
td .btn.primary,.rowacts .btn.primary{background:var(--paper);color:var(--red-ink);border-color:color-mix(in srgb,var(--red) 35%,var(--line));box-shadow:none}
td .btn.primary:hover,.rowacts .btn.primary:hover{background:var(--red-soft);border-color:var(--red)}
.al-yes{background:var(--grey-soft);border-color:transparent;color:var(--ink)}

.dot,.bar-row .tr i,.stack i{box-shadow:0 0 0 1px rgba(128,128,128,.28)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kpi.total{background:radial-gradient(120% 140% at 100% 0,#5a1824 0,#241d1f 62%);border-color:#3a3033}}
:root[data-theme="dark"] .kpi.total{background:radial-gradient(120% 140% at 100% 0,#5a1824 0,#241d1f 62%);border-color:#3a3033}
/* login */
.login{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.login-art{background:radial-gradient(90% 70% at 100% 0,rgba(200,16,46,.55) 0,rgba(200,16,46,0) 60%),radial-gradient(70% 60% at 0 100%,rgba(120,10,28,.45) 0,rgba(120,10,28,0) 60%),#0C0A0B;padding:52px clamp(32px,6vw,88px)}
.login-art:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(80% 80% at 70% 20%,#000,transparent);-webkit-mask-image:radial-gradient(80% 80% at 70% 20%,#000,transparent);pointer-events:none}
.login-art>*{position:relative;z-index:1}.login-art>.sim{position:absolute;z-index:0}
.login-art h1{font:400 clamp(44px,5vw,72px)/1 var(--f-display);font-stretch:normal;letter-spacing:-.025em;max-width:11ch}
.login-art h1 em{font-style:italic;color:#ff8a99}
.login-art p{font-size:16px;opacity:.78;max-width:40ch;line-height:1.6}
.login-art .facts{gap:36px;border-top:1px solid rgba(255,255,255,.14);padding-top:26px}
.login-art .facts b{font:400 40px/1 var(--f-display);font-stretch:normal}
.login-art .facts span{font-size:12.5px;opacity:.7;line-height:1.45;display:block;margin-top:6px}
.login-art .brand .wm{font-size:28px}.sim{right:32px;top:15%;width:min(250px,34%);transform:rotate(7deg);opacity:.9;filter:drop-shadow(0 30px 40px rgba(0,0,0,.45))}
.login-form{background:var(--paper)}
.login-card{width:min(390px,100%);gap:20px}
.login-card h2{font:400 40px/1.05 var(--f-display);letter-spacing:-.02em}
.login-card .sub{margin:-8px 0 6px;font-size:14px}
.lockmsg{border-radius:10px}
.dbstatus{font-size:12px}
@media (max-width:980px){.shell{grid-template-columns:minmax(0,1fr)}.login{grid-template-columns:minmax(0,1fr)}.login-art{padding:32px 24px}.login-art h1{font-size:44px;max-width:none}}
@media (max-width:640px){.kpi .v{font-size:44px}.modal>header{padding:24px 20px 4px}.modal .mbody{padding:14px 20px 6px}.modal>footer{padding:16px 20px 22px}.drawer>header{padding:22px 20px 16px}.drawer .dbody{padding:20px 20px 40px}.page-h h1{font-size:34px}}

/* tipografia v2: uma só família sem serifa (Plus Jakarta Sans) */
h1,h2{font-weight:700;letter-spacing:-.025em}
.brand .wm{font:800 21px/1 var(--f-display);letter-spacing:-.02em}.brand .wm i{font-style:normal;color:#ff6a7d}
.login-art .brand .wm{font-size:24px}
.page-h h1{font-size:clamp(26px,2.8vw,34px);font-weight:700;line-height:1.1}
.kpi .v{font:700 40px/1 var(--f-display);letter-spacing:-.03em}
.emptystate b{font:600 17px var(--f-display)}
.modal>header h2{font-size:24px;font-weight:700;line-height:1.15}
.drawer>header h2{font-size:30px;font-weight:700;line-height:1.1}
.gcard h3{font:700 19px/1.2 var(--f-display);letter-spacing:-.02em}
.gcard .cnt{font:700 36px/1 var(--f-display);letter-spacing:-.03em}
.login-art h1{font:700 clamp(36px,4.2vw,58px)/1.06 var(--f-display);letter-spacing:-.035em;max-width:12ch}
.login-art h1 em{font-style:normal;color:#ff8a99}
.login-art .facts b{font:700 32px/1 var(--f-display);letter-spacing:-.03em}
.login-card h2{font:700 28px/1.15 var(--f-display);letter-spacing:-.03em}
th{font-weight:700}
input[type=file]{padding:7px 10px;min-height:46px}
input[type=file]::file-selector-button{border:1px solid var(--line);background:var(--canvas);border-radius:8px;padding:6px 12px;margin-right:12px;font:600 13px var(--f-body);cursor:pointer}
.login-art>.sim{top:5%;right:24px;width:min(200px,28%)}
@media (max-width:980px){.login-art h1{font-size:36px}}
@media (max-width:640px){.kpi .v{font-size:36px}.page-h h1{font-size:28px}}

/* logo imagem + barra fina branca */
.brand-img{padding:4px 4px 0}.brand-img img{display:block;width:100%;max-width:190px;height:auto}
.login-art .brand-img img{max-width:min(330px,70%)}
.nav{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.55) transparent;padding-right:4px}
.nav::-webkit-scrollbar{width:3px}
.nav::-webkit-scrollbar-track{background:transparent}
.nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.6);border-radius:3px}
.nav::-webkit-scrollbar-thumb:hover{background:#fff}

.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-right:10px}
.live i{width:7px;height:7px;border-radius:50%;background:#2B7A52;box-shadow:0 0 0 0 rgba(43,122,82,.5);animation:lv 2s infinite}
@keyframes lv{70%{box-shadow:0 0 0 7px rgba(43,122,82,0)}100%{box-shadow:0 0 0 0 rgba(43,122,82,0)}}
.feed{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.feed button{all:unset;display:block;width:100%;box-sizing:border-box;padding:9px 10px;border-radius:8px;cursor:pointer}

async function sha(txt){try{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of txt)h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'x'+h.toString(16)}}
const hashPw=(pw,salt)=>sha(salt+':'+pw);

let DB=null, MODE='none', DBH=null, S={user:null,co:null,last:Date.now()}, F={lines:{},emps:{},devs:{},dash:{},audit:{},users:{}}, LIMIT={lines:25,emps:25,devs:25,audit:40};
const COLLS=['users','groups','cats','employees','devices','lines','moves','audit'];
const clone=x=>JSON.parse(JSON.stringify(x));
const slugify=t=>norm(t).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60);
let SNAP=new Map(), flushT=null, chain=Promise.resolve(), syncSt='idle';
function setSync(st,err){
  syncSt=st;const el=$('#sync');
  if(el){el.className='sync '+st;el.textContent=({idle:'',saving:'Salvando…',saved:'Salvo no banco',error:'Não salvo'})[st]||''}
  if(st==='error'){console.warn('db',err);toast('Não foi possível salvar no banco. '+(err&&err.code==='invalid_argument'?'Seu acesso ao AtivaOne é somente leitura.':'Tente de novo em instantes.'),true)}
}
function companyDoc(){const c=DB.companies.find(x=>x.id===S.co);return {...c,perms:DB.perms[S.co]}}
function snapshotAll(){
  SNAP.clear();COLLS.forEach(k=>DB[k].filter(o=>o.co===S.co).forEach(o=>SNAP.set(k+'/'+o.id,JSON.stringify(o))));
  SNAP.set('companies/'+S.co,JSON.stringify(companyDoc()));
}
async function doFlush(){
  if(MODE!=='db'||!DBH||!S.co)return;
  const ops=[],seen=new Set(),cd=companyDoc(),ck='companies/'+cd.id,cs=JSON.stringify(cd);
  if(SNAP.get(ck)!==cs)ops.push(['set',ck,cd,cs]);
  COLLS.forEach(k=>DB[k].forEach(o=>{if(o.co!==S.co)return;const key=k+'/'+o.id,j=JSON.stringify(o);seen.add(key);if(SNAP.get(key)!==j)ops.push(['set',key,o,j])}));
  SNAP.forEach((_,key)=>{if(!seen.has(key)&&key!==ck)ops.push(['del',key])});
  if(!ops.length)return;
  setSync('saving');
  try{
    for(const [t,key,obj,j] of ops){
      if(t==='set'){await DBH.doc(key).set(clone(obj));SNAP.set(key,j)}else{await DBH.doc(key).delete();SNAP.delete(key)}
    }
    setSync('saved');
  }catch(e){setSync('error',e)}
}
const flush=()=>{clearTimeout(flushT);flushT=null;chain=chain.then(doFlush);return chain};
function save(){
  if(MODE==='db'){clearTimeout(flushT);flushT=setTimeout(flush,250)}
}
async function loadCompany(coId){
  const cs=await DBH.doc('companies/'+coId).get();if(!cs.exists)throw new Error('empresa');
  const cd=clone(cs.data());const perms=cd.perms||DEFAULT_PERMS();delete cd.perms;

function fieldHTML(f,v){

  if(f.type==='select')inp=`<select id="${id}"${dis}>${f.blank===false?'':`<option value="">${esc(f.blankLabel||'Selecione')}</option>`}${opts(f.options,val)}</select>`;
  else if(f.type==='textarea')inp=`<textarea id="${id}" rows="3" placeholder="${esc(f.ph||'')}"${dis}>${esc(val)}</textarea>`;
  else if(f.type==='checkbox')return `<div class="fld${f.span?' span2':''}" data-fld="${f.id}"><label class="check"><input type="checkbox" id="${id}"${val?' checked':''}> ${esc(f.label)}</label></div>`;
  else if(f.type==='file')inp=`<input type="file" id="${id}" multiple>`;
  else inp=`<input type="${f.type||'text'}" id="${id}" value="${esc(val)}" placeholder="${esc(f.ph||'')}"${f.max?` maxlength="${f.max}"`:''}${f.inputmode?` inputmode="${f.inputmode}"`:''} autocomplete="off"${dis}>`;

async function submitLogin(){

  $('#l_go').disabled=true;const r=await tryLoginDb(email,pw);$('#l_go')&&($('#l_go').disabled=false);
  if(r.err){msg.innerHTML=`<div class="lockmsg">${esc(r.err)}</div>`;$('#l_pw').value='';$('#l_pw').focus();return}
  try{localStorage.setItem('ativaone.lastemail',email.toLowerCase())}catch(e){}
  MODE='db';DB=r.data;S={user:DB.users.find(x=>x.id===r.userId),co:r.slug,last:Date.now()};

function filterLines(){
  const f=F.lines,t=norm(f.q||''),d=digits(f.q||'');
  return Lns().filter(l=>{
    if(f.group&&l.groupId!==f.group)return false;
    if(f.cat==='__none'){if(l.catId)return false}else if(f.cat&&l.catId!==f.cat)return false;
    if(f.op&&l.operadora!==f.op)return false;if(f.status&&l.status!==f.status)return false;
    if(f.alloc==='Alocada'&&!l.employeeId)return false;if(f.alloc==='Não alocada'&&l.employeeId)return false;
    if(f.emp&&l.employeeId!==f.emp)return false;if(f.setor&&l.setor!==f.setor)return false;
    if(t){const e=empOf(l.employeeId),ds=lineDevices(l);
      const hay=[fmtPhone(l.number),l.number,l.iccid,e&&e.name,e&&e.matricula,l.plano,...ds.map(x=>devLabel(x)+' '+x.patrimonio)].map(norm).join(' ');
      if(!hay.includes(t)&&!(d.length>3&&(l.number.includes(d)||(l.iccid||'').includes(d))))return false}
    return true}).sort((a,b)=>a.number.localeCompare(b.number));
}
function linesList(){
  const all=filterLines(),rows=all.slice(0,LIMIT.lines);
  if(!Lns().length)return `<div class="emptystate"><b>Nenhuma linha cadastrada</b><span>Comece pelas categorias e pelos colaboradores, depois cadastre a primeira linha.</span><span>${can('linhas.criar')?'<button class="btn sm primary" data-act="new-line">Nova linha</button>':''}</span></div>`;
  if(!all.length)return `<div class="emptystate"><b>Nenhuma linha encontrada</b><span>Ajuste a busca ou limpe os filtros para ver todas as linhas.</span><span><button class="btn sm" data-act="clear-lines">Limpar filtros</button> ${can('linhas.criar')?'<button class="btn sm primary" data-act="new-line">Nova linha</button>':''}</span></div>`;
  return `<div class="tablewrap"><table><thead><tr><th>Número</th><th>Colaborador</th><th>Grupo e categoria</th><th>Situação</th><th>Alocação</th><th>Aparelho</th><th class="r">Custo mensal</th><th><span class="sr">Ações</span></th></tr></thead><tbody>
  ${rows.map(l=>{const e=empOf(l.employeeId),ds=lineDevices(l),mov=can('linhas.movimentar');
   const quick=mov&&l.status===ST.LIVRE?`<button class="btn sm primary" data-act="line-allocate" data-id="${l.id}">Alocar</button>`:mov&&l.employeeId&&l.status!==ST.CANC?`<button class="btn sm" data-act="line-return" data-id="${l.id}">Devolver</button>`:'';
   return `<tr data-act="open-line" data-id="${l.id}" class="${l.status===ST.CANC?'dim':''}" tabindex="0"><td><span class="main num" style="font-size:16px">${fmtPhone(l.number)}</span><small>${esc(l.operadora)} · ${l.iccid?'ICCID …'+esc(l.iccid.slice(-6)):'sem ICCID'}</small></td>
   <td>${e?`<span class="main">${esc(e.name)}</span><small>${esc(e.setor||'')}</small>`:'<span class="muted">—</span>'}</td><td><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start">${grpTag(l.groupId)}${catTag(l.catId)}</div></td><td>${stTag(l.status)}</td><td>${alTag(l)}</td>
   <td>${ds[0]?`<span class="main">${esc(ds[0].modelo)}</span><small>${esc(ds[0].fabricante)}</small>`:'<span class="muted">—</span>'}</td><td class="r num">${money(l.cost)}</td><td class="r"><div class="rowacts">${quick}</div></td></tr>`}).join('')}
  </tbody></table></div><div class="tfoot"><span>Mostrando <b>${rows.length}</b> de <b>${all.length}</b> ${plural(all.length,'linha','linhas')}</span>${all.length>rows.length?'<button class="btn sm" data-act="more" data-ns="lines">Mostrar mais</button>':''}</div>`;
}

/* ---------- exportação ---------- */
function csvCell(v){const s=String(v??'');return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function exportModal(title,cols,rows,filterDesc){
  if(!guard('relatorios.exportar'))return;
  const meta=[['AtivaOne'],['Empresa',co().name],['Relatório',title],['Gerado em',fmtDT(Date.now())],['Gerado por',S.user.name],['Filtros',filterDesc||'Nenhum'],[]];
  const csv=[...meta,cols,...rows].map(r=>r.map(csvCell).join(';')).join('\n');
  audit('Exportou','Relatório',null,title+' ('+rows.length+' registros)');save();
  infoModal({title:'Exportar '+title.toLowerCase(),sub:`${rows.length} ${plural(rows.length,'registro','registros')} com os filtros aplicados. Copie e cole em Excel ou Google Planilhas (separador ponto e vírgula).`,wide:true,
    body:`<textarea class="csvbox" id="csvtxt" readonly aria-label="Conteúdo CSV">${esc(csv)}</textarea>`,
    footer:'<button class="btn" data-act="m-close">Fechar</button><button class="btn primary" data-act="copy-csv">'+ic('copy')+'Copiar tudo</button>'});
}
ACT['copy-csv']=async()=>{const t=$('#csvtxt');t.select();let ok=false;try{await navigator.clipboard.writeText(t.value);ok=true}catch(e){try{ok=document.execCommand('copy')}catch(_){}}toast(ok?'Conteúdo copiado.':'Copie com Ctrl+C: o texto já está selecionado.',!ok)};
const filterDescLines=()=>{const f=F.lines,p=[];if(f.q)p.push('busca "'+f.q+'"');if(f.group)p.push('grupo '+(grpOf(f.group)||{}).name);if(f.cat)p.push('categoria '+(f.cat==='__none'?'sem categoria':(catOf(f.cat)||{}).name));if(f.op)p.push('operadora '+f.op);if(f.status)p.push('situação '+f.status);if(f.alloc)p.push(f.alloc);if(f.emp)p.push('colaborador '+empName(f.emp));if(f.setor)p.push('setor '+f.setor);return p.join(', ')};
function lineRow(l){const e=empOf(l.employeeId),ds=lineDevices(l);return [fmtPhone(l.number),l.operadora,l.service,l.iccid,(grpOf(l.groupId)||{}).name||'',(catOf(l.catId)||{}).name||'',l.status,allocStatus(l),e?e.name:'',e?e.matricula:'',l.setor||'',l.plano||'',ds[0]?devLabel(ds[0]):'',l.cost!=null?String(l.cost).replace('.',','):'',fmtDate(l.activatedAt),fmtDate(l.allocatedAt),fmtDate(l.returnedAt),l.obs||'']}

  const alocSection=l?{title:'Alocação',hint:'Automático',note:`Situação atual: <b>${esc(l.status)}</b> · ${esc(allocStatus(l))}${l.employeeId?' a '+esc(empName(l.employeeId)):''}. Para alocar, devolver, transferir ou bloquear, use as ações na ficha da linha, que gravam o histórico.`,fields:[]}
   :{title:'Alocação',hint:'Datas são preenchidas automaticamente',fields:[{id:'status',label:'Situação inicial',type:'select',blank:false,req:true,options:[ST.LIVRE,ST.ALOC,ST.REG],hint:'Disponível aparece como não alocada.'},{id:'emp',label:'Colaborador',type:'select',req:true,options:empOptions(true),dep:['status',[ST.ALOC]],hint:'Obrigatório quando a linha está alocada.'}]};
  formModal({title:l?'Editar linha':'Nova linha',sub:l?fmtPhone(l.number):'Preencha o que já souber. Os campos com * são obrigatórios.',wide:true,values:v||base,submitLabel:l?'Salvar alterações':'Salvar linha',
   sections:[
    {title:'Dados da linha',fields:[
      {id:'number',label:'Número com DDD',req:true,type:'tel',inputmode:'numeric',ph:'(11) 98765-4321',max:16},
      {id:'operadora',label:'Operadora',type:'select',blank:false,req:true,options:co().operadoras},
      {id:'service',label:'Tipo de serviço',type:'select',blank:false,req:true,options:SERVICES},
      {id:'iccid',label:'ICCID / número do chip',ph:'89550… (19 ou 20 dígitos)',inputmode:'numeric',max:22,hint:'Recomendado. Não pode repetir em outra linha.'},
      {id:'group',label:'Grupo',type:'select',req:true,options:grpOpts(l&&l.groupId)},
      {id:'cat',label:'Categoria',type:'select',req:true,options:catOpts(l&&l.catId)},

      {id:'plano',label:'Plano contratado',ph:'Ex.: Empresarial 40 GB'},
      {id:'act',label:'Data de ativação',type:'date'}]},
    alocSection,
    {title:'Aparelho',hint:'Opcional',fields:[{id:'dev',label:'Aparelho usado com esta linha',type:'select',span:true,blankLabel:'Nenhum aparelho vinculado',options:free.map(d=>[d.id,devLabel(d)+' · '+d.patrimonio])}]},
    {title:'Custos',fields:[{id:'cost',label:'Custo mensal (R$)',type:'number',ph:'0,00',hint:'Mudanças ficam no histórico de custos.'},{id:'venc',label:'Dia de vencimento',type:'number',ph:'Ex.: 10'}]},
    {title:'Observações',fields:[{id:'obs',label:'Observações',type:'textarea',span:true},...(l?[]:[{id:'files',label:'Anexos (termo de responsabilidade, comprovantes)',type:'file',span:true,hint:'Neste protótipo só o nome do arquivo é guardado.'}])]}],
   validate:val=>{const e={};
     if(!validNumber(val.number))e.number='Informe o número com DDD, com 10 ou 11 dígitos.';
     else{const dup=dupNumber(val.number,l&&l.id);if(dup)e.number='Já existe uma linha ativa com este número: '+(dup.employeeId?'alocada a '+empName(dup.employeeId):'não alocada')+'.'}
     if(val.iccid){if(!/^\d{15,22}$/.test(val.iccid))e.iccid='Use só números (de 15 a 22 dígitos).';else if(dupIccid(val.iccid,l&&l.id))e.iccid='Este ICCID já está em outra linha.'}
     if(val.cost!==''&&(isNaN(+val.cost)||+val.cost<0))e.cost='Informe um valor em reais, sem texto.';
     if(val.venc!==''&&(!(+val.venc>=1&&+val.venc<=31)))e.venc='Use um dia de 1 a 31.';

       DB.lines.push(nl);audit('Criou','Linha',nl.id,fmtPhone(nl.number));

     const ch=diffs(l,after,map);

     Object.assign(l,{number:after.number,operadora:after.operadora,service:after.service,iccid:after.iccid,groupId:after.groupId,catId:after.catId,setor:after.setor,plano:after.plano,cost,venc:after.venc,obs:after.obs,activatedAt:parseDate(val.act),updatedAt:now,updatedBy:S.user.id});
     if((val.dev||'')!==(l.deviceId||'')){const ov=devOf(l.deviceId);ch.push({f:'Aparelho',from:ov?devLabel(ov):'—',to:val.dev?devLabel(devOf(val.dev)):'—'});if(ov)ov.lineId=null;l.deviceId=null;if(val.dev)linkDevice(l,val.dev)}
     if(ch.length)audit('Alterou','Linha',l.id,fmtPhone(l.number),ch);
     save();closeModal();toast(ch.length?'Alterações salvas.':'Nada mudou.');refresh()}});

/* ---------- ficha da linha ---------- */
function lineHistory(l){
  const items=DB.moves.filter(m=>m.co===S.co&&m.entity==='line'&&m.entityId===l.id).map(m=>({ts:m.ts,type:m.type,m}));
  DB.audit.filter(a=>a.co===S.co&&a.entity==='Linha'&&a.entityId===l.id&&(a.action==='Criou'||a.action==='Alterou')).forEach(a=>items.push({ts:a.ts,type:a.action,a}));
  return items.sort((x,y)=>y.ts-x.ts);
}
function histItemHTML(it){
  if(it.m){const m=it.m,cls=/Bloqueio|Cancelamento/.test(m.type)?'bad':/Aloca|Entrega|Reativ/.test(m.type)?'ok':'';
    const who=m.type==='Transferência'?empName(m.fromEmpId)+' → '+empName(m.empId):m.type==='Devolução'||m.type==='Devolução de aparelho'?'de '+empName(m.fromEmpId):m.empId?empName(m.empId):'';
    return `<li class="${cls}"><div><b>${esc(m.type)}${who?' · '+esc(who):''}</b><small>${fmtDT(m.ts)} · por ${esc(whoName(m.userId))}</small>${m.motivo?`<small>Motivo: ${esc(m.motivo)}${m.cond?' · Condição: '+esc(m.cond):''}</small>`:''}${m.obs?`<small>${esc(m.obs)}</small>`:''}</div></li>`}
  const a=it.a;return `<li><div><b>${a.action==='Criou'?'Cadastro criado':'Cadastro alterado'}</b><small>${fmtDT(a.ts)} · por ${esc(a.userName)}</small>${(a.changes||[]).map(c=>`<small>${esc(c.f)}: ${esc(c.from)} → ${esc(c.to)}</small>`).join('')}</div></li>`}
function lineFicha(dr){
  const l=lineOf(dr.id);if(!l)return null;const e=empOf(l.employeeId),ds=lineDevices(l),mov=can('linhas.movimentar'),blk=can('linhas.bloquear'),tab=dr.tab||'resumo';

  if(blk&&(l.status===ST.BLOQ||l.status===ST.REG))A.push(`<button class="btn" data-act="line-reactivate" data-id="${l.id}">Reativar</button>`);

  let body=`<div class="actions">${A.join('')||'<span class="muted">Seu perfil só permite consulta.</span>'}</div>
   <div class="tabs" role="tablist">${[['resumo','Resumo'],['hist','Histórico'],['custos','Custos']].map(([k,t])=>`<button role="tab" aria-selected="${tab===k}" data-act="dr-tab" data-t="${k}">${t}</button>`).join('')}</div>`;
  if(tab==='resumo'){
    const pend=pendencias().filter(p=>p.id===l.id);
    body+=(pend.length?`<div class="note bad">${pend.map(p=>esc(p.t)).join('. ')}.</div>`:'')+
    `<div class="where"><span class="k">Localização atual</span>${e?`<b>${esc(e.name)}</b><span>${esc([e.setor||(grpOf(e.groupId)||{}).name,ds.length?devLabel(ds[0]):'sem aparelho vinculado'].filter(Boolean).join(' · '))}</span><small>Com este colaborador ${ago(l.allocatedAt)}</small>`:`<b>${l.status===ST.LIVRE?'Em estoque':esc(l.status)}</b><span>${l.status===ST.LIVRE?'Disponível para alocar':'Sem colaborador vinculado'}</span>${l.returnedAt?`<small>Devolvida ${ago(l.returnedAt)}</small>`:''}`}</div>`+
    `<dl class="dl"><dt>Colaborador</dt><dd>${e?`<a href="#" data-act="open-emp" data-id="${e.id}">${esc(e.name)}</a> ${empStTag(e.status)}`:'Não alocada'}</dd>
    <dt>Operadora</dt><dd>${esc(l.operadora)}</dd><dt>Tipo de serviço</dt><dd>${esc(l.service)}</dd><dt>ICCID</dt><dd class="num">${esc(l.iccid||'—')}</dd>
    <dt>Setor</dt><dd>${esc(l.setor||'—')}</dd><dt>Plano</dt><dd>${esc(l.plano||'—')}</dd>
    <dt>Aparelho</dt><dd>${ds.length?ds.map(d=>`<a href="#" data-act="open-dev" data-id="${d.id}">${esc(devLabel(d))}</a>`).join(', '):'—'}</dd>
    <dt>Ativação</dt><dd>${fmtDate(l.activatedAt)}</dd><dt>Alocada em</dt><dd>${fmtDate(l.allocatedAt)}</dd><dt>Devolvida em</dt><dd>${fmtDate(l.returnedAt)}</dd>
    <dt>Custo mensal</dt><dd>${money(l.cost)}</dd><dt>Vencimento</dt><dd>${l.venc?'Dia '+esc(l.venc):'—'}</dd>

function flow(o){

    sections:[{fields:o.fields}],validate:o.validate,
    onSubmit(val){confirmDialog({title:o.confirmTitle||o.title,rows:[...o.rows(val),NOW_ROW(),WHO_ROW()],label:o.label,danger:o.danger,note:o.note&&o.note(val),
      onBack:()=>o.reopen(val),onConfirm(){const a=AFTER;AFTER=null;o.apply(val);closeModal();toast(o.ok(val));refresh();if(a)a()}})}});
}

function flowAllocate(id,v={}){

  flow({title:'Alocar linha',sub:fmtPhone(l.number)+' · '+l.operadora,v:{group:l.groupId,cat:l.catId,...v},
    fields:[{id:'emp',label:'Colaborador ativo',type:'select',req:true,span:true,options:empOptions(true)},{id:'group',label:'Grupo',type:'select',req:true,options:grpOpts(l.groupId)},{id:'cat',label:'Categoria',type:'select',req:true,options:catOpts(l.catId)},{id:'obs',label:'Observação',type:'textarea',span:true}],
    rows:val=>[LN(l),['Colaborador',empName(val.emp)],['Grupo',(grpOf(val.group)||{}).name],['Categoria',(catOf(val.cat)||{}).name],['Observação',val.obs]],
    note:val=>Lns().some(x=>x.id!==l.id&&x.employeeId===val.emp&&x.status!==ST.CANC)?'Este colaborador já tem outra linha alocada.':'',
    label:'Alocar linha',reopen:val=>flowAllocate(id,val),apply:val=>doAllocate(l,val.emp,{groupId:val.group,catId:val.cat,obs:val.obs}),ok:val=>'Linha alocada a '+empName(val.emp)+'.'});

function flowReturn(id,v={}){

     {id:'destino',label:'A linha passa a ficar',type:'select',blank:false,req:true,span:true,options:[[ST.LIVRE,'Disponível (não alocada)'],[ST.BLOQ,'Bloqueada'],[ST.REG,'Em regularização']],hint:'Se não estiver apta para reutilização, bloqueie ou envie para regularização.'},

function flowTransfer(id,v={}){
  const l=lineOf(id);if(!l||!guard('linhas.movimentar'))return;if(!l.employeeId){toast('Esta linha não está alocada.',true);return}

function simpleStatusFlow(id,cfg,v={}){

  </tbody></table></div><div class="tfoot"><span>Mostrando <b>${rows.length}</b> de <b>${all.length}</b> ${plural(all.length,'colaborador','colaboradores')}</span>${all.length>rows.length?'<button class="btn sm" data-act="more" data-ns="emps">Mostrar mais</button>':''}</div>`;

   onSubmit:val=>{
     const rec={name:val.name,matricula:val.matricula,cpf:val.cpf,cargo:val.cargo,setor:val.setor,groupId:val.group,catId:val.cat||null,contato:val.contato,inicio:parseDate(val.inicio),fim:parseDate(val.fim),obs:val.obs};

function offboard(id){

  openModal({title:'Desligar '+esc(e.name),sub:ls.length||ds.length?'Este colaborador ainda tem itens. Devolva antes de desligar para não deixar pendências.':'Nenhum item pendente com este colaborador.',
   body:(ls.length||ds.length)?`<div class="plist">${ls.map(l=>row('<span class="num">'+fmtPhone(l.number)+'</span>',esc(l.operadora)+' · '+esc(l.status),'off-line',l.id)).join('')}${ds.map(d=>row(esc(devLabel(d)),esc(d.patrimonio)+' · '+esc(d.estado),'off-dev',d.id)).join('')}</div><div class="note warn">Se desligar agora, os itens aparecem como pendência no painel. O histórico de movimentações não é apagado.</div>`:'<div class="note">Ao desligar, a data de término do vínculo é preenchida hoje.</div>',

  CUR={submit(){const old=e.status;e.status='Inativo';if(!e.fim)e.fim=Date.now();audit('Desligou','Colaborador',e.id,e.name,[{f:'Situação',from:old,to:'Inativo'}]);save();closeModal();toast(e.name+' foi desligado.');refresh()}};
}

  return `<div class="page-h"><div><h1>Categorias</h1><p>Crie, edite e inative categorias de linha sem depender de ajuste no sistema.</p></div><div class="acts">${cg?`<button class="btn primary" data-act="new-cat">${ic('plus')}Nova categoria</button>`:''}</div></div>
  <section class="panel"><div class="tablewrap" style="max-height:none"><table><thead><tr><th>Categoria</th><th>Descrição</th><th>Cor</th><th>Situação</th><th>Criada em</th><th class="r">Linhas</th><th><span class="sr">Ações</span></th></tr></thead><tbody>
  ${cs.map(c=>`<tr data-act="${cg?'edit-cat':'goto'}" data-id="${c.id}" data-r="linhas" data-ns="lines" data-k="cat" data-v="${c.id}" class="${c.active?'':'dim'}"><td>${catTag(c.id)}</td><td>${esc(c.desc||'—')}</td><td><span class="dot" style="background:${esc(c.color)};width:18px;height:18px;vertical-align:middle"></span> <span class="num">${esc(c.color)}</span></td><td><span class="tag ${c.active?'es-ok':'es-off'}">${c.active?'Ativa':'Inativa'}</span></td><td>${fmtDate(c.createdAt)}</td><td class="r num">${Lns().filter(l=>l.catId===c.id).length}</td><td class="r"><div class="rowacts"><button class="btn sm" data-act="goto" data-r="linhas" data-ns="lines" data-k="cat" data-v="${c.id}">Ver linhas</button></div></td></tr>`).join('')}
  </tbody></table></div></section>`;
};
ACT['new-grp']=()=>taxForm('groups');ACT['edit-grp']=d=>taxForm('groups',d.id);ACT['new-cat']=()=>taxForm('cats');ACT['edit-cat']=d=>taxForm('cats',d.id);

/* =====================  USUÁRIOS E ACESSOS  ===================== */
const tempPw=()=>'Tmp'+Math.random().toString(36).slice(2,8)+'#'+Math.floor(10+Math.random()*89);
V.usuarios=()=>{
  const tab=F.users.tab||'usuarios',c=co();
  let h=`<div class="page-h"><div><h1>Usuários e acessos</h1><p>Quem entra no sistema de ${esc(c.name)} e o que cada perfil pode fazer.</p></div><div class="acts">${tab==='usuarios'?`<button class="btn primary" data-act="new-user">${ic('plus')}Novo usuário</button>`:''}</div></div>
  <div class="tabs" role="tablist">${[['usuarios','Usuários'],['perm','Permissões por perfil'],['param','Empresa e parâmetros']].map(([k,t])=>`<button role="tab" aria-selected="${tab===k}" data-act="users-tab" data-t="${k}">${t}</button>`).join('')}</div>`;
  if(tab==='usuarios')h+=`<section class="panel"><div class="tablewrap" style="max-height:none;border-top:0"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Situação</th><th><span class="sr">Ações</span></th></tr></thead><tbody>
   ${Usrs().map(u=>`<tr data-act="edit-user" data-id="${u.id}" class="${u.status==='Ativo'?'':'dim'}"><td><span class="main">${esc(u.name)}</span>${u.mustChange?'<small>Aguardando primeiro acesso</small>':''}</td><td>${esc(u.email)}</td><td>${esc(ROLES[u.role])}</td><td><span class="tag ${u.status==='Ativo'?'es-ok':u.status==='Pendente'?'es-warn':'es-off'}">${u.status==='Pendente'?'Aguardando ativação':u.status}</span></td>
   <td class="r"><div class="rowacts"><button class="btn sm" data-act="reset-user" data-id="${u.id}">${ic('key')}Nova senha</button>${u.id!==S.user.id?`<button class="btn sm ${u.status==='Ativo'?'danger':u.status==='Pendente'?'primary':''}" data-act="toggle-user" data-id="${u.id}">${u.status==='Ativo'?'Inativar':u.status==='Pendente'?'Ativar':'Reativar'}</button>`:''}</div></td></tr>`).join('')}</tbody></table></div></section>`;
  if(tab==='perm'){const P=DB.perms[S.co];h+=`<section class="panel"><div class="body"><p class="muted" style="margin:0 0 12px">As mudanças valem na hora para todos os usuários do perfil. Exclusão definitiva não existe: registros são inativados para manter o histórico.</p><div class="mtx"><table><thead><tr><th>Ação</th>${Object.keys(ROLES).map(r=>`<th>${esc(ROLES[r])}</th>`).join('')}</tr></thead><tbody>
   ${PERMS.map(([k,t])=>`<tr><td>${esc(t)}</td>${Object.keys(ROLES).map(r=>`<td><input type="checkbox" data-perm="${k}" data-role="${r}" ${P[r][k]?'checked':''} ${r==='admin'?'disabled':''} aria-label="${esc(t)} para ${esc(ROLES[r])}"></td>`).join('')}</tr>`).join('')}</tbody></table></div></div></section>`}
  if(tab==='param'){
    const tags=(list,label)=>`<section class="panel"><header><h3>${label}</h3></header><div class="body"><div class="tagedit">${c[list].map(x=>`<span class="tag">${esc(x)}<button data-act="par-del" data-list="${list}" data-v="${esc(x)}" aria-label="Remover ${esc(x)}">×</button></span>`).join('')}</div>
     <form class="filters" style="margin-top:12px" data-act-submit="par-add" data-list="${list}"><div class="fld"><label class="sr" for="par_${list}">Novo item</label><input type="text" id="par_${list}" placeholder="Adicionar item" maxlength="40"></div><button class="btn" type="submit">Adicionar</button></form></div></section>`;
    h+=`<div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><section class="panel"><header><h3>Empresa</h3></header><div class="body"><dl class="dl"><dt>Nome</dt><dd>${esc(c.name)}</dd><dt>CNPJ</dt><dd class="num">${esc(c.cnpj)}</dd></dl>
     <form class="filters" style="margin-top:14px" data-act-submit="par-timeout"><div class="fld"><label for="p_to">Encerrar sessão por inatividade (minutos)</label><input type="number" id="p_to" min="1" max="240" value="${c.timeout}"></div><button class="btn" type="submit">Salvar</button></form></div></section>
     <section class="panel"><header><h3>Cópia de segurança</h3></header><div class="body" style="display:grid;gap:10px"><p class="muted" style="margin:0">Copie os dados da empresa em um texto e guarde com a TI. Para voltar a um ponto anterior, cole a cópia em Restaurar.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="backup">${ic('save')}Copiar backup</button><button class="btn" data-act="restore">Restaurar backup</button></div></div></section>
     ${tags('operadoras','Operadoras')}${tags('fabricantes','Fabricantes de aparelhos')}${tags('setores','Setores e centros de custo')}</div>`}
  return h;
};
ACT['users-tab']=d=>{F.users.tab=d.t;renderView()};
function userForm(id,v){
  const u=id?usrOf(id):null;if(id&&!u)return;if(!guard('usuarios.gerir'))return;
  formModal({title:u?'Editar usuário':'Novo usuário',sub:u?u.name:'Uma senha temporária será criada. A pessoa troca no primeiro acesso.',submitLabel:u?'Salvar alterações':'Criar usuário',values:v||(u?{name:u.name,email:u.email,role:u.role,status:u.status}:{role:'operador',status:'Ativo'}),
   sections:[{fields:[{id:'name',label:'Nome completo',req:true,span:true},{id:'email',label:'E-mail (é o acesso da pessoa)',type:'email',req:true,span:true,disabled:!!u},{id:'role',label:'Perfil',type:'select',blank:false,req:true,options:Object.entries(ROLES)},{id:'status',label:'Situação',type:'select',blank:false,options:['Ativo','Pendente','Inativo']}]}],
   validate:val=>{const e={};
     if(!/^\S+@\S+\.\S+$/.test(val.email))e.email='Informe um e-mail válido.';else if(!u&&DB.users.some(x=>mailKey(x.email)===mailKey(val.email)))e.email='Este e-mail já tem cadastro.';
     if(u&&u.id===S.user.id&&val.status==='Inativo')e.status='Você não pode inativar o seu próprio acesso.';
     if(u&&u.role==='admin'&&(val.role!=='admin'||val.status==='Inativo')&&Usrs().filter(x=>x.role==='admin'&&x.status==='Ativo').length<2)e.role='A empresa precisa de ao menos um administrador ativo.';return e},
   onSubmit:async val=>{
     if(!u){const mk=mailKey(val.email);
       let pw=tempPw(),salt=Math.random().toString(36).slice(2,10),hash=null;if(SB){try{const r=await rpcS('ao_criar_usuario',{p_email:mk,p_nome:val.name,p_perfil:val.role,p_status:val.status});pw=r.senha_temp}catch(e){const el=$('#e_email');if(e.code==='email_existe'&&el){el.textContent='Este e-mail já tem cadastro.';el.closest('.fld').classList.add('bad')}else toast('Não foi possível criar o usuário agora.',true);return}}else hash=await hashPw(pw,salt);const nu={id:mk,co:S.co,login:mk,name:val.name,email:mk,role:val.role,status:val.status,mustChange:true,createdAt:Date.now()};if(!SB){nu.salt=salt;nu.hash=hash}DB.users.push(nu);audit('Criou','Usuário',nu.id,nu.name+' ('+ROLES[nu.role]+')');save();closeModal();showTemp(nu,pw);refresh();return}
     const ch=diffs(u,{...u,name:val.name,email:val.email,role:val.role,status:val.status},{name:['Nome'],email:['E-mail'],role:['Perfil',x=>ROLES[x]],status:['Situação']});Object.assign(u,{name:val.name,email:val.email,role:val.role,status:val.status});
     if(ch.length)audit(ch.some(c=>c.f==='Situação')&&val.status==='Inativo'?'Inativou':'Alterou','Usuário',u.id,u.name,ch);save();closeModal();toast('Usuário atualizado.');refresh()}});
}
function showTemp(u,pw){infoModal({title:'Senha temporária criada',sub:'Passe esta senha a '+esc(u.name)+' por um canal seguro. Ela aparece só agora.',body:`<dl class="dl"><dt>E-mail de acesso</dt><dd class="num">${esc(u.email)}</dd><dt>Senha temporária</dt><dd class="num" style="font-size:20px">${esc(pw)}</dd></dl><div class="note">No primeiro acesso a pessoa define a própria senha e aceita as regras de uso.</div>`})}
ACT['new-user']=()=>userForm(null);ACT['edit-user']=d=>userForm(d.id);
ACT['reset-user']=d=>{  const u=usrOf(d.id);if(!u||!guard('usuarios.gerir'))return;confirmDialog({title:'Criar nova senha',sub:'A senha atual deixa de funcionar.',rows:[['Usuário',u.name+' ('+u.login+')'],WHO_ROW()],label:'Criar senha temporária',danger:true,onConfirm:async()=>{let pw=tempPw();if(SB){try{pw=(await rpcS('ao_nova_senha',{p_email:u.email})).senha_temp}catch(e){toast('Não foi possível criar a senha agora.',true);return}}else{u.salt=Math.random().toString(36).slice(2,10);u.hash=await hashPw(pw,u.salt)}u.mustChange=true;audit('Redefiniu senha','Usuário',u.id,u.name);save();closeModal();showTemp(u,pw);refresh()}})};
ACT['toggle-user']=d=>{const u=usrOf(d.id);if(!u||!guard('usuarios.gerir'))return;const off=u.status==='Ativo';
  if(off&&u.role==='admin'&&Usrs().filter(x=>x.role==='admin'&&x.status==='Ativo').length<2){toast('A empresa precisa de ao menos um administrador ativo.',true);return}
  confirmDialog({title:off?'Inativar usuário':u.status==='Pendente'?'Ativar usuário':'Reativar usuário',sub:off?'O acesso é bloqueado agora.':'O acesso passa a funcionar.',rows:[['Usuário',u.name],['Perfil',ROLES[u.role]],NOW_ROW(),WHO_ROW()],label:off?'Inativar acesso':'Ativar acesso',danger:off,onConfirm(){u.status=off?'Inativo':'Ativo';audit(off?'Inativou':'Reativou','Usuário',u.id,u.name);save();closeModal();toast(off?'Acesso inativado.':'Acesso ativado.');refresh()}})};
function permToggle(el){if(!guard('usuarios.gerir')){el.checked=!el.checked;return}const P=DB.perms[S.co],role=el.dataset.role,k=el.dataset.perm;P[role][k]=el.checked;
  audit('Alterou','Permissões',role,ROLES[role],[{f:PERMS.find(p=>p[0]===k)[1],from:el.checked?'Não':'Sim',to:el.checked?'Sim':'Não'}]);save();toast('Permissão atualizada.');renderNav()}
ACT['par-del']=d=>{if(!guard('usuarios.gerir'))return;const c=co();if(d.list==='operadoras'&&c[d.list].length<2){toast('Mantenha ao menos uma operadora na lista.',true);return}c[d.list]=c[d.list].filter(x=>x!==d.v);audit('Alterou','Parâmetros',c.id,d.list,[{f:'Removido',from:d.v,to:'—'}]);save();renderView()};
function parAdd(form){if(!guard('usuarios.gerir'))return;const l=form.dataset.list,i=form.querySelector('input'),v=i.value.trim(),c=co();if(!v)return;if(c[l].some(x=>norm(x)===norm(v))){toast('Este item já existe.',true);return}c[l].push(v);audit('Alterou','Parâmetros',c.id,l,[{f:'Adicionado',from:'—',to:v}]);save();renderView();$('#par_'+l)?.focus()}
function parTimeout(form){if(!guard('usuarios.gerir'))return;const n=parseInt(form.querySelector('input').value,10),c=co();if(!(n>=1&&n<=240)){toast('Informe de 1 a 240 minutos.',true);return}const old=c.timeout;c.timeout=n;audit('Alterou','Parâmetros',c.id,'Tempo de sessão',[{f:'Sessão (min)',from:old,to:n}]);save();toast('Tempo de sessão salvo.')}
ACT.backup=()=>{if(!guard('usuarios.gerir'))return;const bk={format:'ativaone-backup',version:1,company:co().id,at:Date.now()};['companies','users','groups','cats','employees','devices','lines','moves','audit'].forEach(k=>bk[k]=DB[k].filter(x=>(k==='companies'?x.id:x.co)===S.co));bk.perms=DB.perms[S.co];
  const txt=JSON.stringify(bk);audit('Gerou backup','Sistema',null,'Cópia de segurança');save();
  infoModal({title:'Backup da empresa',sub:'Copie e guarde em local seguro. Contém dados pessoais.',wide:true,body:`<textarea class="csvbox" id="csvtxt" readonly aria-label="Backup">${esc(txt)}</textarea>`,footer:'<button class="btn" data-act="m-close">Fechar</button><button class="btn primary" data-act="copy-csv">'+ic('copy')+'Copiar tudo</button>'})};
ACT.restore=()=>{if(!guard('usuarios.gerir'))return;formModal({title:'Restaurar backup',sub:'Os dados atuais da empresa serão substituídos pelos do backup.',wide:true,danger:true,submitLabel:'Restaurar dados',sections:[{fields:[{id:'txt',label:'Conteúdo do backup',type:'textarea',req:true,span:true}]}],
  validate:v=>{try{const b=JSON.parse(v.txt);if(b.format!=='ativaone-backup'||b.company!==S.co)return{txt:'Este backup não é desta empresa ou está incompleto.'}}catch(e){return{txt:'Não foi possível ler o texto. Cole o backup completo.'}}return{}},
  onSubmit:v=>{const b=JSON.parse(v.txt);['users','groups','cats','employees','devices','lines','moves','audit'].forEach(k=>{DB[k]=DB[k].filter(x=>x.co!==S.co).concat(b[k]||[])});if(b.companies&&b.companies[0])DB.companies=DB.companies.map(c=>c.id===S.co?b.companies[0]:c);if(b.perms)DB.perms[S.co]=b.perms;
   if(!DB.users.find(u=>u.id===S.user.id))DB.users.push(S.user);audit('Restaurou backup','Sistema',null,'Dados restaurados');save();closeModal();toast('Backup restaurado.');refresh()}})};

const DIMS={group:['Grupo',l=>(grpOf(l.groupId)||{}).name||'Sem grupo'],cat:['Categoria',l=>(catOf(l.catId)||{}).name||'Sem categoria'],op:['Operadora',l=>l.operadora],setor:['Setor / centro de custo',l=>l.setor||'Sem setor'],emp:['Colaborador',l=>empName(l.employeeId)==='—'?'Não alocada':empName(l.employeeId)]};
const dimOpts=keys=>keys.map(k=>[k,DIMS[k][0]]);
const grpFilter={id:'group',label:'Grupo',options:()=>Grps().map(g=>[g.id,g.name]),blank:'Todos'};
const REPORTS=[
 {id:'alocacao',title:'Linhas alocadas e não alocadas',desc:'Quem está com cada linha e quais estão livres.',filters:[{id:'alloc',label:'Alocação',options:['Alocada','Não alocada'],blank:'Todas'},grpFilter,{id:'status',label:'Situação',options:LINE_STATUS,blank:'Todas'}],
  build(v){const ls=Lns().filter(l=>(!v.alloc||allocStatus(l)===v.alloc)&&(!v.group||l.groupId===v.group)&&(!v.status||l.status===v.status)).sort((a,b)=>a.number.localeCompare(b.number));
   return {cols:['Número','Operadora','Grupo','Categoria','Situação','Alocação','Colaborador','Setor'],rows:ls.map(l=>[fmtPhone(l.number),l.operadora,(grpOf(l.groupId)||{}).name||'Sem grupo',(catOf(l.catId)||{}).name||'Sem categoria',l.status,allocStatus(l),empName(l.employeeId)==='—'?'':empName(l.employeeId),l.setor||''])}}},
 {id:'agrupado',title:'Linhas por grupo, categoria, operadora, setor ou colaborador',desc:'Totais por situação, agrupados como você escolher.',filters:[{id:'dim',label:'Agrupar por',options:dimOpts(Object.keys(DIMS)),blank:null,def:'group'}],
  build(v){const d=DIMS[v.dim||'group'],m={};Lns().forEach(l=>{const k=d[1](l);(m[k]=m[k]||[]).push(l)});
   const rows=Object.entries(m).sort((a,b)=>b[1].length-a[1].length).map(([k,ls])=>[k,ls.length,...LINE_STATUS.map(s=>ls.filter(l=>l.status===s).length),ls.reduce((s,l)=>s+(l.status===ST.CANC?0:(l.cost||0)),0)]);
   return {cols:[d[0],'Total',...LINE_STATUS,'Custo mensal (R$)'],rows:rows.map(r=>[...r.slice(0,-1),r[r.length-1].toFixed(2).replace('.',',')]),num:[1,2,3,4,5,6,7]}}},
 {id:'aparelhos',title:'Aparelhos por modelo, patrimônio, estado e responsável',desc:'Inventário com quem está de posse de cada aparelho.',filters:[{id:'estado',label:'Estado',options:DEV_STATES,blank:'Todos'},{id:'sit',label:'Situação',options:[['uso','Em uso'],['livre','Sem colaborador']],blank:'Todas'}],
  build(v){const ds=Devs().filter(d=>(!v.estado||d.estado===v.estado)&&(!v.sit||(v.sit==='uso'?d.employeeId:!d.employeeId))).sort((a,b)=>devLabel(a).localeCompare(devLabel(b),'pt-BR'));return {cols:DEV_COLS,rows:ds.map(devRow)}}},
 {id:'historico',title:'Histórico de movimentações',desc:'Alocações, devoluções, transferências, bloqueios e cancelamentos.',filters:[{id:'tipo',label:'Tipo',options:()=>[...new Set(DB.moves.filter(m=>m.co===S.co).map(m=>m.type))].sort(),blank:'Todos'},{id:'de',label:'De',type:'date'},{id:'ate',label:'Até',type:'date'}],
  build(v){const a=v.de?parseDate(v.de)-DAY/2:0,b=v.ate?parseDate(v.ate)+DAY/2:Infinity;
   const ms=DB.moves.filter(m=>m.co===S.co&&(!v.tipo||m.type===v.tipo)&&m.ts>=a&&m.ts<=b).sort((x,y)=>y.ts-x.ts);
   return {cols:['Data e hora','Tipo','Item','Colaborador','De','Motivo','Condição','Responsável','Observação'],rows:ms.map(m=>{const it=m.entity==='line'?fmtPhone((lineOf(m.entityId)||{}).number):devLabel(devOf(m.entityId)||{fabricante:'',modelo:'Aparelho removido'});return [fmtDT(m.ts),m.type,it,m.empId?empName(m.empId):'',m.fromEmpId?empName(m.fromEmpId):'',m.motivo||'',m.cond||'',whoName(m.userId),m.obs||'']})}}},
 {id:'custos',title:'Custos mensais',desc:'Soma do custo mensal informado nas linhas não canceladas.',filters:[{id:'dim',label:'Agrupar por',options:dimOpts(['op','group','cat','setor']),blank:null,def:'op'}],
  build(v){const d=DIMS[v.dim||'op'],m={};Lns().filter(l=>l.status!==ST.CANC&&l.cost!=null).forEach(l=>{const k=d[1](l);(m[k]=m[k]||[]).push(l)});
   const tot=Object.values(m).flat().reduce((s,l)=>s+l.cost,0);
   const rows=Object.entries(m).map(([k,ls])=>[k,ls.length,ls.reduce((s,l)=>s+l.cost,0)]).sort((a,b)=>b[2]-a[2]);
   return {cols:[d[0],'Linhas com custo','Custo mensal','Parte do total'],rows:[...rows.map(r=>[r[0],r[1],money(r[2]),tot?Math.round(r[2]/tot*100)+'%':'—']),['Total',rows.reduce((s,r)=>s+r[1],0),money(tot),'100%']],num:[1,2,3]}}},
 {id:'pend',title:'Pendências e inconsistências',desc:'O que precisa de correção no cadastro ou na devolução.',filters:[],
  build(){const P=pendencias();return {cols:['Pendência','Item','Detalhe'],rows:P.map(p=>[p.t,p.kind==='line'?'Linha':'Aparelho',p.ref])}}}
];
function repFilterHTML(def){const v=F.rep.vals;return def.filters.map(f=>{const o=typeof f.options==='function'?f.options():f.options;
  if(f.type==='date')return `<div class="fld"><label for="rv_${f.id}">${f.label}</label><input type="date" id="rv_${f.id}" data-f="repv.${f.id}" value="${esc(v[f.id]||'')}"></div>`;
  const cur=v[f.id]!==undefined?v[f.id]:(f.def||'');return `<div class="fld"><label for="rv_${f.id}">${f.label}</label><select id="rv_${f.id}" data-f="repv.${f.id}">${f.blank===null?'':`<option value="">${f.blank}</option>`}${opts(o,cur)}</select></div>`}).join('')}
function repBody(){
  const def=REPORTS.find(r=>r.id===F.rep.id),res=def.build(F.rep.vals);F.rep.res=res;const num=res.num||[];
  const fd=def.filters.map(f=>{const x=F.rep.vals[f.id];if(!x)return null;const o=typeof f.options==='function'?f.options():f.options;const hit=o.find(y=>(Array.isArray(y)?y[0]:y)===x);return f.label+': '+(hit?(Array.isArray(hit)?hit[1]:hit):x)}).filter(Boolean).join(', ');F.rep.fd=fd;
